name: איתור מיקומים ליעדים חדשים

# מורץ ידנית בלבד. הרשת של הסביבה המקומית חוסמת את שירות המיקומים, אבל של
# GitHub פתוחה - ולכן זה המקום שבו הסקריפט באמת יכול לרוץ, בלי להתקין כלום.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'כמה מקומות לבדוק (5 = ריצת ניסיון, ריק = כל ה-305)'
        type: string
        default: '5'
      commit:
        description: 'לשמור את התוצאה לענף? (השאירו כבוי בריצת ניסיון)'
        type: boolean
        default: false

jobs:
  geocode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: איתור המיקומים
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            node scripts/geocode_pending.js --limit "${{ inputs.limit }}"
          else
            node scripts/geocode_pending.js
          fi

      # גם בריצת ניסיון - כך אפשר להוריד את קובץ הבדיקה ולראות מה לא נמצא
      - name: שמירת התוצאות להורדה
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geocode-results
          path: |
            supabase/migrations_new_landmarks_from_list.sql
            data/geocode_accepted.csv
            data/geocode_review.csv
          if-no-files-found: ignore

      - name: שמירה לענף
        if: inputs.commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A supabase/migrations_new_landmarks_from_list.sql data/geocode_accepted.csv data/geocode_review.csv
          git diff --staged --quiet && echo "אין שינוי לשמור" && exit 0
          git commit -m "יעדים חדשים: מיקומים שאותרו אוטומטית מהרשימה"
          git push
