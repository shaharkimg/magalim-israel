name: בדיקות

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      check_live:
        description: 'לבדוק גם את האתר החי (דורש שהדומיין כבר עובד)'
        type: boolean
        default: true

jobs:
  repo:
    name: בדיקות הריפו
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: תחביר
        run: |
          node --check app.js
          node --check sw.js
          node --check config.js

      - name: איזון סוגריים ב-CSS
        run: |
          node -e "
            const h = require('fs').readFileSync('index.html','utf8');
            const css = h.slice(h.indexOf('<style>')+7, h.lastIndexOf('</style>'));
            let d = 0;
            for (const c of css) { if (c === '{') d++; if (c === '}') d--; }
            if (d !== 0) { console.error('CSS braces unbalanced: ' + d); process.exit(1); }
            console.log('css brace balance: 0');
          "

      - name: גרסה אחידה בשלושת המקומות
        run: node scripts/check_version.js

      - name: פונקציות קריטיות מחוברות
        run: node scripts/check_wiring.js

      - name: אריזת TWA עקבית
        run: node scripts/check_twa.js

      - name: אבטחה (אין כתיבה ישירה לניקוד, XSS, סודות)
        run: node scripts/check_security.js

      - name: נגישות לקורא מסך
        run: node scripts/check_a11y.js

      - name: בדיקות לוגיקה
        run: |
          node scripts/test_geolocation.js
          node scripts/test_view_reset.js
          node scripts/test_recommendation.js
          node scripts/test_auth_views.js
          node scripts/test_oauth_error.js
          node scripts/test_client_safety.js

      # פקדי המפה נבדקים ב-hit-testing בדפדפן אמיתי - קריאת CSS לא תופסת את הבאג הזה
      - name: התקנת Playwright וספריות המפה
        run: |
          npm install --no-save playwright leaflet@1.9.4 leaflet.markercluster@1.5.3 canvas-confetti@1.9.3
          npx playwright install --with-deps chromium

      - name: פקדי המפה לחיצים
        run: node scripts/test_map_controls.js

      # דפדפן אמיתי מול Supabase מדומה: עלייה עם 1,500 יעדים, XSS, צ'ק-אין דרך השרת, כשל טעינה
      - name: בדיקת עשן מקצה-לקצה
        run: node scripts/test_app_smoke.js

  database:
    name: בדיקות מסד הנתונים (RLS, צ'ק-אין, הרשאות)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # משחזר את כל ה-migrations האמיתיים על Postgres נקי ומריץ את בדיקות ההרשאות/ניקוד
      - name: migrations + בדיקות SQL
        run: bash supabase/tests/run.sh
      - name: התאמת נוסחאות ניקוד בין הלקוח לשרת
        run: node scripts/test_xp_parity.js

  live:
    name: בדיקת האתר החי
    runs-on: ubuntu-latest
    # רץ רק בהפעלה ידנית, כי הוא תלוי בדומיין חיצוני ולא בקוד
    if: github.event_name == 'workflow_dispatch' && inputs.check_live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check_live.js
