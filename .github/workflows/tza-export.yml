name: tza-export

on:
  push:
    branches: [claude-tza-export]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow pyproj shapely numpy
      - run: python tools/tza_export.py
        continue-on-error: true
        env:
          PARCELS: "2100242/149,4732/32,6876/6"
          POINTS: "160735.17,589306.33;31.328586938073247,34.68184880908194"
      - uses: actions/upload-artifact@v4
        with:
          name: tza
          path: out
      - name: commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out
          git commit -m "tza export output [skip ci]" || echo "nothing to commit"
          git push origin HEAD:claude-tza-export
