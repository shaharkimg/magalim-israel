name: tza-export

on:
  push:
    branches: [claude-tza-export]
  workflow_dispatch:
    inputs:
      parcels:
        description: "gush/helka,gush/helka"
        required: false
        default: ""
      points:
        description: "lat,lon;lat,lon  (resolve parcel containing the point)"
        required: false
        default: ""
      locality_parcels:
        description: "locality/helka,locality/helka  (helka '*' lists gushim)"
        required: false
        default: ""
      centers:
        description: "ITM x,y[,half_m];x,y[,half_m]  render around a coordinate"
        required: false
        default: ""
      parcel_layer:
        description: "WFS feature type for parcels (default opendata:PARCEL_ALL)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  export:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow pyproj shapely numpy
      - run: python tools/tza_export.py
        continue-on-error: true
        env:
          PARCELS: ${{ github.event.inputs.parcels }}
          POINTS: ${{ github.event.inputs.points }}
          LOCALITY_PARCELS: ${{ github.event.inputs.locality_parcels }}
          PARCEL_LAYER: ${{ github.event.inputs.parcel_layer }}
          CENTERS: ${{ github.event.inputs.centers }}
      - uses: actions/upload-artifact@v4
        with:
          name: tza
          path: out
          retention-days: 1
      - name: commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out
          git commit -m "tza export output [skip ci]" || echo "nothing to commit"
          git push origin HEAD:claude-tza-export
