name: tza-probe

on:
  push:
    branches: [claude-tza-probe]
  workflow_dispatch:
    inputs:
      gx:
        description: "ITM X"
        required: false
        default: "160890"
      gy:
        description: "ITM Y"
        required: false
        default: "589470"
      radius:
        description: "search radius in metres"
        required: false
        default: "200"

permissions:
  contents: write

jobs:
  probe:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow pyproj shapely numpy
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: mkdir -p out && python tools/govmap_api.py
        continue-on-error: true
        env:
          OUTDIR: out
          GX: ${{ github.event.inputs.gx }}
          GY: ${{ github.event.inputs.gy }}
          RADIUS: ${{ github.event.inputs.radius }}
          GOVMAP_TOKEN: ${{ secrets.GOVMAP_TOKEN }}
      - name: commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out
          git commit -m "probe output [skip ci]" || echo "nothing to commit"
          git push origin HEAD:claude-tza-probe
