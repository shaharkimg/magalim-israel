name: tza-probe

on:
  push:
    branches: [claude-tza-probe]

permissions:
  contents: write

jobs:
  probe:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow pyproj shapely numpy
      - run: cd tools && PARCELS="" POINTS="" python tza_probe.py && PARCELS="" POINTS="" python tza_plan.py && mkdir -p ../out && cp -r out/. ../out/
        continue-on-error: true
        env:
          PLAN: "651-0484089"
          PROBE_GUSH: "100805"
      - name: commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out
          git commit -m "probe output [skip ci]" || echo "nothing to commit"
          git push origin HEAD:claude-tza-probe
